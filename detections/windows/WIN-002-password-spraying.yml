id: b4c6a2e7-31d9-4f80-a5bb-72f0f6db8e22
name: Windows VM - Password Spraying Attack Detected
description: Identifies failed Windows authentication attempts from one source IP against multiple accounts on an Azure Windows VM. The rule requires distributed failures with a low number of attempts per account to distinguish password spraying from single-account brute force.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes: [SecurityEvent]
  - connectorId: WindowsSecurityEvents
    dataTypes: [SecurityEvent]
queryFrequency: 5m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1110, T1110.003]
query: |
  let DetectionWindow = 15m;
  let MinimumAccounts = 5;
  let MinimumFailures = 10;
  let MaxFailuresPerAccount = 5;
  let AllowedSources = _GetWatchlist('Windows_PasswordSpray_AllowedSources') | project SearchKey;
  SecurityEvent
  | where TimeGenerated >= ago(DetectionWindow)
  | where EventID == 4625 and isnotempty(IpAddress) and isnotempty(TargetUserName)
  | where IpAddress !in ("-", "::1", "127.0.0.1") and IpAddress !in (AllowedSources)
  | where TargetUserName !in~ ("ANONYMOUS LOGON", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
  | where LogonType in (2,3,10)
  | summarize FailedAttempts=count(), FirstAttempt=min(TimeGenerated), LastAttempt=max(TimeGenerated) by IpAddress, Computer, TargetUserName
  | where FailedAttempts <= MaxFailuresPerAccount
  | summarize TotalFailures=sum(FailedAttempts), TargetedAccounts=dcount(TargetUserName), TargetedAccountList=make_set(TargetUserName,50), FirstAttempt=min(FirstAttempt), LastAttempt=max(LastAttempt), MaxFailuresAgainstSingleAccount=max(FailedAttempts) by IpAddress, Computer
  | where TargetedAccounts >= MinimumAccounts and TotalFailures >= MinimumFailures
  | extend AttackType="Password Spraying", DetectionWindowMinutes=datetime_diff("minute", LastAttempt, FirstAttempt)
  | project TimeGenerated=LastAttempt, Computer, IpAddress, AttackType, TotalFailures, TargetedAccounts, TargetedAccountList, MaxFailuresAgainstSingleAccount, FirstAttempt, LastAttempt, DetectionWindowMinutes
  | order by TargetedAccounts desc, TotalFailures desc
entityMappings:
  - entityType: Host
    fieldMappings: [{identifier: FullName, columnName: Computer}]
  - entityType: IP
    fieldMappings: [{identifier: Address, columnName: IpAddress}]
customDetails:
  AttackType: AttackType
  SourceIP: IpAddress
  TargetHost: Computer
  TotalFailures: TotalFailures
  TargetedAccounts: TargetedAccounts
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT1H
    matchingMethod: Selected
    groupByEntities: [Host, IP]
version: 1.0.0
kind: Scheduled
