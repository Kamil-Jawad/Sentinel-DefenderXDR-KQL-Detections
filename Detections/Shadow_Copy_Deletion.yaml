id: 11111111-2222-3333-4444-555555555507
name: Volume Shadow Copy Deletion (Ransomware Activity)
description: Identifies attempt to delete volume shadow copies using vssadmin or wmic.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1490
query: |
  SecurityEvent
  | where EventID == 4688
  | where (ProcessName endswith "vssadmin.exe" and CommandLine has "delete" and CommandLine has "shadows")
     or (ProcessName endswith "wmic.exe" and CommandLine has "shadowcopy" and CommandLine has "delete")
  | project TimeGenerated, Account, Computer, ProcessName, CommandLine
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
