id: 11111111-2222-3333-4444-555555555506
name: New Scheduled Task Created via CLI
description: Detects creation of scheduled tasks using schtasks.exe.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - Persistence
  - Execution
relevantTechniques:
  - T1053.005
query: |
  SecurityEvent
  | where EventID == 4688
  | where ProcessName endswith "schtasks.exe"
  | where CommandLine has "/create"
  | project TimeGenerated, Account, Computer, CommandLine, ParentProcessName
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
