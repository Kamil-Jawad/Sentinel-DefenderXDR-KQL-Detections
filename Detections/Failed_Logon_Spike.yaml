id: 11111111-2222-3333-4444-555555555502
name: High Volume Failed Logons (Possible Brute Force)
description: Detects a single account with over 10 failed logon attempts within one hour.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
query: |
  SecurityEvent
  | where EventID == 4625
  | summarize FailedCount = count() by Account, Computer, IpAddress, bin(TimeGenerated, 1h)
  | where FailedCount > 10
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress
