id: 11111111-2222-3333-4444-555555555503
name: Encoded PowerShell Command Execution
description: Identifies PowerShell executing commands using Base64 encoded flags.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - Execution
  - DefenseEvasion
relevantTechniques:
  - T1059.001
  - T1027
query: |
  SecurityEvent
  | where EventID == 4688
  | where ProcessName endswith "powershell.exe" or ProcessName endswith "pwsh.exe"
  | where CommandLine has_any ("-e ", "-enc ", "-encodedcommand ")
  | project TimeGenerated, Account, Computer, ProcessName, CommandLine, ParentProcessName
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Account
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
