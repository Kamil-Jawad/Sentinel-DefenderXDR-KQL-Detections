name: Deploy YAML Sentinel Rules

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert YAML Rules to ARM Templates
        shell: pwsh
        run: |
          # Create output directory for generated ARM JSONs
          New-Item -ItemType Directory -Force -Path "./ARM_Templates"
          
          # Install powershell-yaml module silently
          Install-Module -Name powershell-yaml -Scope CurrentUser -Force
          
          # Process YAML files
          $yamlFiles = Get-ChildItem -Path ./Detections/*.yaml, ./Detections/*.yml -ErrorAction SilentlyContinue
          
          if ($null -eq $yamlFiles -or $yamlFiles.Count -eq 0) {
              Write-Host "No YAML detection files found in ./Detections"
              exit 0
          }
          
          foreach ($file in $yamlFiles) {
              $yaml = Get-Content $file.FullName -Raw | ConvertFrom-Yaml
              
              $armTemplate = @{
                  '$schema' = "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#"
                  contentVersion = "1.0.0.0"
                  resources = @(
                      @{
                          type = "Microsoft.OperationalInsights/workspaces/providers/alertRules"
                          apiVersion = "2022-11-01-preview"
                          name = "sentinel-law/Microsoft.SecurityInsights/$($yaml.id)"
                          kind = "Scheduled"
                          properties = @{
                              displayName      = $yaml.displayName
                              description      = $yaml.description
                              severity         = $yaml.severity
                              enabled          = [bool]$yaml.enabled
                              query            = $yaml.query
                              queryFrequency   = $yaml.queryFrequency
                              queryPeriod      = $yaml.queryPeriod
                              triggerOperator  = $yaml.triggerOperator
                              triggerThreshold = [int]$yaml.triggerThreshold
                          }
                      }
                  )
              }
              
              $jsonPath = "./ARM_Templates/$($file.BaseName).json"
              $armTemplate | ConvertTo-Json -Depth 10 | Set-Content -Path $jsonPath
              Write-Host "Successfully converted $($file.Name) -> $jsonPath"
          }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS }}

      - name: Deploy ARM Templates via Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            shopt -s nullglob
            files=(./ARM_Templates/*.json)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No ARM templates to deploy."
              exit 0
            fi
            
            for file in "${files[@]}"; do
              echo "Deploying $file..."
              az deployment group create \
                --resource-group cybersecurity-rg \
                --template-file "$file"
            done
