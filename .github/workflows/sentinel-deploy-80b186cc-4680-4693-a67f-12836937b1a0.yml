name: Deploy Content to Microsoft Sentinel

on:
  push:
    branches: [ main ]
    paths:
      - 'detections/**/*.yml'
      - 'detections/**/*.yaml'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  deploy-content:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: Azure/Sentinel-Repositories@v2.1
      with:
        creds: ${{ secrets.AZURE_SENTINEL_CREDENTIALS_80b186cc46804693a67f12836937b1a0 }}
        workspaceId: '80b186cc-4680-4693-a67f-12836937b1a0'
        subscriptionId: 'ad53e885-f3f0-46f4-a830-a583b0273392'
        resourceGroupName: 'cybersecurity-rg'
        workspaceName: 'sentinel-law'
        smartDeployment: 'true'
