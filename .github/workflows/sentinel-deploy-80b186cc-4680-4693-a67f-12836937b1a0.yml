name: Deploy Content to sentinel-law [80b186cc-4680-4693-a67f-12836937b1a0]

on:
  push:
    branches: [ main ]
    paths:
      - 'detections/windows/**'
      - '!.github/workflows/**'
      - '.github/workflows/sentinel-deploy-80b186cc-4680-4693-a67f-12836937b1a0.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'cybersecurity-rg'
      workspaceName: 'sentinel-law'
      workspaceId: '9a5d6687-b4fe-4855-aa47-796da478c835'
      directory: '${{ github.workspace }}/detections/windows'
      cloudEnv: 'AzureCloud'
      contentTypes: 'AnalyticsRule'
      branch: 'main'
      sourceControlId: '80b186cc-4680-4693-a67f-12836937b1a0'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_80b186cc46804693a67f12836937b1a0 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_80b186cc46804693a67f12836937b1a0 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_80b186cc46804693a67f12836937b1a0 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_80b186cc46804693a67f12836937b1a0 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_80b186cc46804693a67f12836937b1a0 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_80b186cc46804693a67f12836937b1a0 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_80b186cc46804693a67f12836937b1a0 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_80b186cc46804693a67f12836937b1a0 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_80b186cc46804693a67f12836937b1a0 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-80b186cc-4680-4693-a67f-12836937b1a0.ps1
